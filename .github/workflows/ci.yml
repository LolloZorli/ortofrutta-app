name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dapi.version=1.44
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Docker è già disponibile sui runner: Testcontainers avvia PostgreSQL da solo
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # controllo dei tipi + build di produzione

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/lollozorli/ortofrutta-app-backend:${{ github.sha }}
            ghcr.io/lollozorli/ortofrutta-app-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/lollozorli/ortofrutta-app-frontend:${{ github.sha }}
            ghcr.io/lollozorli/ortofrutta-app-frontend:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_KUBERNETES == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Apply Kubernetes resources
        run: kubectl apply -f k8s/app.yaml
      - name: Deploy published images
        run: |
          kubectl -n ortofrutta set image deployment/ortofrutta-backend backend=ghcr.io/lollozorli/ortofrutta-app-backend:${GITHUB_SHA}
          kubectl -n ortofrutta set image deployment/ortofrutta-frontend frontend=ghcr.io/lollozorli/ortofrutta-app-frontend:${GITHUB_SHA}
          kubectl -n ortofrutta rollout status deployment/ortofrutta-backend --timeout=5m
          kubectl -n ortofrutta rollout status deployment/ortofrutta-frontend --timeout=5m
