name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dapi.version=1.44
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Docker è già disponibile sui runner: Testcontainers avvia PostgreSQL da solo
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # controllo dei tipi + build di produzione

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/lollozorli/ortofrutta-app-backend:${{ github.sha }}
            ghcr.io/lollozorli/ortofrutta-app-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/lollozorli/ortofrutta-app-frontend:${{ github.sha }}
            ghcr.io/lollozorli/ortofrutta-app-frontend:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo "Repository secret KUBE_CONFIG is required"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info
      - name: Configure GHCR image pull access
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          test -n "$GHCR_USERNAME" || { echo "Repository secret GHCR_USERNAME is required"; exit 1; }
          test -n "$GHCR_READ_TOKEN" || { echo "Repository secret GHCR_READ_TOKEN is required"; exit 1; }
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace default \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_READ_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply Kubernetes resources
        run: kubectl apply -f k8s/
      - name: Deploy images from this commit
        run: |
          kubectl set image deployment/ortofrutta-backend \
            backend=ghcr.io/lollozorli/ortofrutta-app-backend:${GITHUB_SHA}
          kubectl set image deployment/ortofrutta-frontend \
            frontend=ghcr.io/lollozorli/ortofrutta-app-frontend:${GITHUB_SHA}
          kubectl rollout status deployment/ortofrutta-backend --timeout=180s
          kubectl rollout status deployment/ortofrutta-frontend --timeout=180s
