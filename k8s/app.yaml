apiVersion: v1
kind: Namespace
metadata:
  name: ortofrutta
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data-pvc
  namespace: ortofrutta
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: ortofrutta
spec:
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "ortofrutta"
            - name: POSTGRES_USER
              value: "ortofrutta"
            - name: POSTGRES_PASSWORD
              value: "ortofrutta"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pgdata
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pg-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: ortofrutta
spec:
  type: LoadBalancer
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ortofrutta-backend
  namespace: ortofrutta
  labels:
    app: ortofrutta-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ortofrutta-backend
  template:
    metadata:
      labels:
        app: ortofrutta-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/lollozorli/ortofrutta-app-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: ortofrutta-config
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ortofrutta
  labels:
    app: ortofrutta-backend
spec:
  type: LoadBalancer
  selector:
    app: ortofrutta-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ortofrutta-frontend
  namespace: ortofrutta
  labels:
    app: ortofrutta-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ortofrutta-frontend
  template:
    metadata:
      labels:
        app: ortofrutta-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/lollozorli/ortofrutta-app-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ortofrutta-frontend
  namespace: ortofrutta
  labels:
    app: ortofrutta-frontend
spec:
  type: LoadBalancer
  selector:
    app: ortofrutta-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http