apiVersion: apps/v1
kind: Deployment
metadata:
  name: ortofrutta-backend
  labels:
    app: ortofrutta-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ortofrutta-backend
  template:
    metadata:
      labels:
        app: ortofrutta-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/lollozorli/ortofrutta-app-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: ortofrutta-config
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: ortofrutta-backend
spec:
  type: ClusterIP
  selector:
    app: ortofrutta-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ortofrutta-frontend
  labels:
    app: ortofrutta-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ortofrutta-frontend
  template:
    metadata:
      labels:
        app: ortofrutta-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/lollozorli/ortofrutta-app-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ortofrutta-frontend
  labels:
    app: ortofrutta-frontend
spec:
  type: LoadBalancer
  selector:
    app: ortofrutta-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
