spring:
  application:
    name: ortofrutta
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:true}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ortofrutta}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USERNAME:ortofrutta}
    password: ${DB_PASSWORD:ortofrutta}
  jpa:
    hibernate:
      ddl-auto: validate   # lo schema lo gestisce Flyway
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 50
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true          # risposte JSON compresse: meno traffico, specie da telefono
    min-response-size: 1024

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  password-reset:
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
    base-url: ${PASSWORD_RESET_BASE_URL:}
  notifications:
    recipient-emails: ${NOTIFICATION_RECIPIENT_EMAILS:}
  jwt:
    # In produzione: variabile d'ambiente JWT_SECRET, lunga e casuale (min. 32 caratteri)
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
    expiration: 8h
  admin:
    # Utente creato al primo avvio se la tabella utenti è vuota
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    # Se true, al primo accesso l'amministratore deve scegliere una nuova password
    must-change-password: ${ADMIN_MUST_CHANGE_PASSWORD:true}
  demo:
    staff-password: ${DEMO_STAFF_PASSWORD:commesso123}
    manager-password: ${DEMO_MANAGER_PASSWORD:responsabile123}
    warehouse-password: ${DEMO_WAREHOUSE_PASSWORD:magazziniere123}
