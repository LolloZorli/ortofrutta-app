services:
  # Frontend PWA: Render serves the built assets over HTTPS and supplies an onrender.com URL.
  - type: web
    name: ortofrutta-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ortofrutta-backend
          property: url

  # Spring API. The generated database credentials and JWT key stay in Render's environment.
  - type: web
    name: ortofrutta-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: 1c-2g
    region: frankfurt
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MUST_CHANGE_PASSWORD
        value: "true"
      - key: APP_CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: ortofrutta-frontend
          property: url
      - key: DB_HOST
        fromDatabase:
          name: ortofrutta-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ortofrutta-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ortofrutta-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ortofrutta-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ortofrutta-db
          property: password

databases:
  - name: ortofrutta-db
    databaseName: ortofrutta
    user: ortofrutta
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "16"
    diskSizeGB: 1
