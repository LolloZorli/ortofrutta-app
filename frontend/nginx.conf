server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Risposte compresse: meno traffico, specie da telefono
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Il backend si chiama "backend" nella rete di docker compose.
    # La variabile + resolver fanno risolvere il nome al momento della richiesta,
    # così nginx parte anche se il backend non è ancora pronto.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single page application: ogni percorso sconosciuto torna a index.html
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
