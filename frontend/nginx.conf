server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Risposte compresse: meno traffico, specie da telefono
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # "backend" è il nome del servizio sia in Docker Compose sia in Kubernetes.
    location /api/ {
        proxy_pass http://backend:8080;
        # L'app passa da questo reverse proxy sullo stesso origin; inoltrare Origin
        # farebbe trattare la richiesta come cross-origin anche se arriva da nginx.
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single page application: ogni percorso sconosciuto torna a index.html
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
